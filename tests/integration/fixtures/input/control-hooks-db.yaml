fingerprint_library_version: "0.1.0"

dhcp4:
  valid-lifetime: 3600
  renew-timer: 1800
  rebind-timer: 3000

  control-sockets:
    - socket-type: http
      socket-address: "127.0.0.1"
      socket-port: 8004

  interfaces-config:
    interfaces:
      - eth0
      - eth1
    dhcp-socket-type: udp

  lease-database:
    type: postgresql
    name: kea
    host: db.example.com
    port: 5432
    user: kea
    password: secret

  hooks-libraries:
    - library: libdhcp_pgsql.so
    - library: libdhcp_ha.so
      parameters:
        high-availability:
          - this-server-name: dhcp1
            mode: hot-standby
            peers:
              - name: dhcp2
                url: http://192.0.2.2:8004

  subnets:
    - subnet: 10.0.0.0/24
      pools:
        - range: auto
      reservations:
        - hw-address: "aa:bb:cc:dd:ee:ff"
          ip-address: 10.0.0.50

dhcp6:
  valid-lifetime: 7200

  control-sockets:
    - socket-type: unix
      socket-name: kea6-ctrl-socket

  interfaces-config:
    interfaces:
      - eth0

  lease-database:
    type: memfile
    persist: true
    name: "/var/lib/kea/dhcp6.leases"

  hooks-libraries:
    - library: libdhcp_ha.so
      parameters:
        high-availability:
          - this-server-name: dhcp1-v6
            mode: hot-standby

  subnets:
    - subnet: "2001:db8:1::/64"
      pools:
        - pool-type: na
          range: auto
