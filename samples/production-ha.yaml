fingerprint_library_version: "0.1.0"

dhcp4:
  valid-lifetime: 3600
  renew-timer: 1800
  rebind-timer: 3000
  dns-servers: ["10.0.0.1", "8.8.8.8"]
  routers: ["10.0.0.1"]

  control-sockets:
    - socket-type: http
      socket-address: 127.0.0.1
      socket-port: 8004

  interfaces-config:
    interfaces: ["eth0"]

  hooks-libraries:
    - library: libdhcp_ha.so
      parameters:
        high-availability:
          - this-server-name: server1
            mode: hot-standby
            heartbeat-delay: 1000
            max-heartbeat-delay: 2000
            max-ack-delay: 1000
            max-unacked-clients: 5
            peers:
              - name: server2
                url: http://192.0.2.2:8004

  subnets:
    - subnet: 10.0.0.0/24
      pools:
        - range: auto
          skip-start: 10
      reservations:
        - hw-address: "aa:bb:cc:dd:ee:ff"
          ip-address: 10.0.0.50
          hostname: printer-01
